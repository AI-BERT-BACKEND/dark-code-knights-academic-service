services:
  academic-db:
    image: postgres:16-alpine
    container_name: academic-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  academic:
    build: .
    container_name: academic-service
    ports:
      - "1502:1502"
    environment:
      DB_HOST: academic-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      academic-db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
